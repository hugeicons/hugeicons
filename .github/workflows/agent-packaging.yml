name: Agent packaging

# The skills in skills/ are shipped through four channels: the Claude Code plugin, the Grok
# Build plugin, the OpenAI plugin package and `npx skills add`. The Claude and Grok plugins hold
# committed copies, because they install straight from git, so those copies can drift. This
# catches that.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'plugins/claude/**'
      - 'plugins/grok/**'
      - 'plugins/openai/**'
      - 'plugins/sync-skills.py'
      - '.claude-plugin/**'
      - '.github/workflows/agent-packaging.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'plugins/claude/**'
      - 'plugins/grok/**'
      - 'plugins/openai/**'
      - 'plugins/sync-skills.py'
      - '.claude-plugin/**'
      - '.github/workflows/agent-packaging.yml'

jobs:
  packaging:
    name: Skills in sync and manifests valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Claude and Grok plugin skills match skills/
        run: python3 plugins/sync-skills.py --check

      - name: Grok plugin manifests are valid JSON
        run: |
          python3 -c "import json; json.load(open('plugins/grok/.grok-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('plugins/grok/.mcp.json'))"

      - name: OpenAI plugin package is valid
        run: python3 plugins/openai/check.py --check

      # check.py syncs its own skill copies before validating. Those copies are gitignored, so
      # a dirty tree here means something tracked changed and needs committing.
      - name: No tracked files changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "These tracked files changed during the checks:"
            git status --porcelain
            exit 1
          fi
